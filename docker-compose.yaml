services:
  finsight-db:
    image: mongo:8.0
    container_name: finsight-database
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: finsight_admin
      MONGO_INITDB_ROOT_PASSWORD: finsight_password
      MONGO_INITDB_DATABASE: finsight_db
    ports:
      - "27017:27017"
    volumes:
      - finsight_db_data:/data/db
    networks:
      - finsight-network

  finsight-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: finsight-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://finsight_admin:finsight_password@finsight-db:27017/finsight_db?authSource=admin
      NEXTAUTH_URL: http://borella-laptop-ubuntu:3000
      NEXTAUTH_SECRET: my_super_super_super_super_super_secret_key_finsight_12345
      # NODE_ENV: production
      NODE_ENV: development
    depends_on:
      - finsight-db
    networks:
      - finsight-network
    # Volumes for development
    volumes:
      - ./app:/app
      - /app/node_modules

volumes:
  finsight_db_data:
    driver: local

networks:
  finsight-network:
    driver: bridge